# Paramètres non secrets partagés par l'API, Spark et PostgreSQL.
# Les hôtes sont les noms des Services Kubernetes, pas ceux de docker-compose.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sales-config
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  KAFKA_TOPIC: sales.orders
  POSTGRES_HOST: postgres
  POSTGRES_DB: sales
